<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="4-Roller Heavy-Duty Cane Milling Tandem schematic">
  <rect width="800" height="520" fill="#F0F3F5"/>
  <rect x="20" y="20" width="760" height="480" fill="#FFFFFF" stroke="#C5D0D8" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="48" fill="#142B3A"/>
  <text x="40" y="50" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">MODEL VSP-MT-4R // 4-ROLLER CANE MILLING TANDEM</text>
  <!-- Headstock frame -->
  <polygon points="180,380 240,140 560,140 620,380" fill="none" stroke="#142B3A" stroke-width="6"/>
  <line x1="150" y1="380" x2="650" y2="380" stroke="#142B3A" stroke-width="8"/>
  <!-- Top roller -->
  <circle cx="400" cy="215" r="56" fill="#E6ECF0" stroke="#D99A36" stroke-width="6"/>
  <circle cx="400" cy="215" r="18" fill="#142B3A"/>
  <!-- Feed roller -->
  <circle cx="315" cy="305" r="52" fill="#E6ECF0" stroke="#31566D" stroke-width="6"/>
  <circle cx="315" cy="305" r="16" fill="#142B3A"/>
  <!-- Discharge roller -->
  <circle cx="485" cy="305" r="52" fill="#E6ECF0" stroke="#31566D" stroke-width="6"/>
  <circle cx="485" cy="305" r="16" fill="#142B3A"/>
  <!-- Underfeed 4th roller -->
  <circle cx="215" cy="255" r="38" fill="#E6ECF0" stroke="#142B3A" stroke-width="5"/>
  <circle cx="215" cy="255" r="12" fill="#D99A36"/>
  <!-- Hydraulic top cap -->
  <rect x="366" y="102" width="68" height="38" fill="#D99A36" stroke="#142B3A" stroke-width="2"/>
  <text x="40" y="468" fill="#546470" font-family="monospace" font-size="12">SAMPLE SCHEMATIC — 2,500 TO 10,000 TCD // FORGED ALLOY SHAFTS &amp; HYDRAULIC LOADING</text>
</svg>
