<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Vertical Continuous Vacuum Pan schematic">
  <rect width="800" height="520" fill="#F0F3F5"/>
  <rect x="20" y="20" width="760" height="480" fill="#FFFFFF" stroke="#C5D0D8" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="48" fill="#142B3A"/>
  <text x="40" y="50" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">MODEL VSP-CVP-120 // VERTICAL CONTINUOUS VACUUM PAN</text>
  <rect x="240" y="110" width="320" height="280" rx="18" fill="#F7F8F6" stroke="#142B3A" stroke-width="4"/>
  <!-- Compartments -->
  <line x1="240" y1="205" x2="560" y2="205" stroke="#31566D" stroke-width="4"/>
  <line x1="240" y1="295" x2="560" y2="295" stroke="#31566D" stroke-width="4"/>
  <line x1="400" y1="110" x2="400" y2="390" stroke="#D99A36" stroke-width="3" stroke-dasharray="8 4"/>
  <!-- Vapor domes -->
  <rect x="355" y="84" width="90" height="26" fill="#D99A36" stroke="#142B3A" stroke-width="2"/>
  <text x="275" y="165" fill="#142B3A" font-family="monospace" font-size="13">CELL 01–04</text>
  <text x="435" y="165" fill="#142B3A" font-family="monospace" font-size="13">CELL 05–08</text>
  <text x="275" y="255" fill="#142B3A" font-family="monospace" font-size="13">CALANDRIA ZONE</text>
  <text x="435" y="345" fill="#142B3A" font-family="monospace" font-size="13">MASSECUITE OUT</text>
  <text x="40" y="468" fill="#546470" font-family="monospace" font-size="12">SAMPLE SCHEMATIC — 25 TO 85 TPH MASSECUITE // LOW-PRESSURE VAPOR BOILING</text>
</svg>
