<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Fully Automatic High-G Batch Centrifugal schematic">
  <rect width="800" height="520" fill="#F0F3F5"/>
  <rect x="20" y="20" width="760" height="480" fill="#FFFFFF" stroke="#C5D0D8" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="48" fill="#142B3A"/>
  <text x="40" y="50" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">MODEL VSP-BC-1750 // AUTOMATIC HIGH-G BATCH CENTRIFUGAL</text>
  <!-- Top motor -->
  <rect x="352" y="96" width="96" height="62" rx="6" fill="#31566D" stroke="#142B3A" stroke-width="3"/>
  <!-- Spindle shaft -->
  <line x1="400" y1="158" x2="400" y2="345" stroke="#D99A36" stroke-width="10"/>
  <!-- Monitor casing -->
  <rect x="245" y="190" width="310" height="170" rx="8" fill="#F7F8F6" stroke="#142B3A" stroke-width="4"/>
  <!-- Perforated Basket -->
  <rect x="285" y="210" width="230" height="125" fill="#E6ECF0" stroke="#31566D" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- Discharge cone -->
  <polygon points="295,360 505,360 455,418 345,418" fill="#E6ECF0" stroke="#142B3A" stroke-width="3"/>
  <text x="40" y="468" fill="#546470" font-family="monospace" font-size="12">SAMPLE SCHEMATIC — 1,250 TO 1,750 KG/CHARGE // REGENERATIVE VFD DRIVE</text>
</svg>
