<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="High-Vacuum Multi-Jet Barometric Condenser schematic">
  <rect width="800" height="520" fill="#F0F3F5"/>
  <rect x="20" y="20" width="760" height="480" fill="#FFFFFF" stroke="#C5D0D8" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="48" fill="#142B3A"/>
  <text x="40" y="50" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">MODEL VSP-MBC-3000 // MULTI-JET BAROMETRIC CONDENSER</text>
  <rect x="315" y="105" width="170" height="165" fill="#F7F8F6" stroke="#142B3A" stroke-width="4"/>
  <polygon points="315,270 485,270 422,360 378,360" fill="#E6ECF0" stroke="#142B3A" stroke-width="4"/>
  <rect x="382" y="360" width="36" height="65" fill="#E6ECF0" stroke="#142B3A" stroke-width="3"/>
  <!-- Spray nozzles -->
  <line x1="350" y1="135" x2="380" y2="210" stroke="#D99A36" stroke-width="3" stroke-dasharray="5 4"/>
  <line x1="400" y1="135" x2="400" y2="225" stroke="#D99A36" stroke-width="3" stroke-dasharray="5 4"/>
  <line x1="450" y1="135" x2="420" y2="210" stroke="#D99A36" stroke-width="3" stroke-dasharray="5 4"/>
  <!-- Vapor inlet -->
  <path d="M 190 190 L 315 190" stroke="#31566D" stroke-width="18"/>
  <text x="160" y="168" fill="#142B3A" font-family="monospace" font-size="12">VAPOR INLET</text>
  <text x="40" y="468" fill="#546470" font-family="monospace" font-size="12">SAMPLE SCHEMATIC — 5 TO 45 TPH VAPOR // 630–660 mmHg VACUUM</text>
</svg>
